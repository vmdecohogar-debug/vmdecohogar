# Publicación en Render: en el panel de Render elegí New > Blueprint y conectá este repositorio.
# Render crea la app, la base de datos y el disco para las fotos con esta configuración.
services:
  - type: web
    runtime: node
    name: vmdecohogar
    plan: 0.5c-512mb
    region: virginia
    buildCommand: npm --prefix server ci && npm --prefix web ci --include=dev && npm --prefix web run build
    startCommand: npm --prefix server run seed && npm --prefix server start
    healthCheckPath: /api/health
    disk:
      name: fotos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vmdecohogar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: SEED_SAMPLE_PRODUCTS
        value: "false"
      - key: WHATSAPP_PROVIDER
        value: simulated
      # Render te los pide al crear el Blueprint
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: vmdecohogar-db
    plan: 0.1c-256mb
    region: virginia
    databaseName: redvendedora
