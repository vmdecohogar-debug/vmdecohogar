    <script>
      // Modo oscuro antes de pintar, para que no parpadee.
      try {
        var m = JSON.parse(localStorage.getItem('vm_mode'));
        if (m === 'dark' || (!m && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
